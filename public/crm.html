<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>НейроДело — кабинет</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="crm.css"></head><body><header class="wrap header"><a class="logo" href="/">НейроДело<span class="logo-dot">.</span></a><span class="eyebrow">ЛИЧНЫЙ КАБИНЕТ</span><button id="logout" class="header-cta" hidden>Выйти</button></header><main class="wrap"><section id="login-panel" class="login-panel"><div class="eyebrow">ТОЛЬКО ДЛЯ ВЛАДЕЛЬЦА</div><h1>Ваш рабочий<br>контур<span class="pink">.</span></h1><p>Заявки, клиенты и следующий шаг.</p><form id="login-form"><label for="password">Пароль</label><input type="password" id="password" required autocomplete="current-password" maxlength="256"><button class="button primary">Войти в CRM →</button></form><a href="/" class="back-link">← Вернуться на сайт</a></section><section id="dashboard" hidden><div class="dashboard-heading"><div><div class="eyebrow">ОТ ПЕРВОГО КОНТАКТА ДО ЗАПУСКА</div><h1>Проекты и заявки<span class="pink">.</span></h1></div><button id="refresh" class="header-cta">Обновить ↻</button></div><div id="stats" class="stats"></div><div class="filters"><input id="search" aria-label="Поиск заявок" placeholder="Найти по имени, контакту или задаче"><select id="filter" aria-label="Статус заявки"><option value="">Все статусы</option></select></div><div id="lead-list" class="lead-list"></div></section><p id="message" role="status" aria-live="polite"></p><dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="client-name"></h2><button type="button" id="close-editor" aria-label="Закрыть">×</button></div><p id="client-contact"></p><p id="client-consent"></p><p id="client-idea" class="client-idea"></p><label for="edit-status">Статус</label><select id="edit-status"></select><label for="next-step">Следующий шаг</label><input id="next-step" maxlength="500" placeholder="Например: отправить предложение в пятницу"><label for="notes">Заметки</label><textarea id="notes" rows="5" maxlength="10000"></textarea><button class="button primary" id="save">Сохранить изменения</button><p id="edit-message" role="status"></p><button type="button" id="reload-current" class="header-cta" hidden>Загрузить актуальные данные</button></form></dialog></main><script src="api-client.js"></script><script src="crm.js"></script></body></html>
