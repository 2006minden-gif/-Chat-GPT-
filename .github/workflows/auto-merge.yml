name: Enable approved auto-merge

on:
  workflow_run:
    workflows: ['NeuroDelo CI/CD']
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved:
    if: >-
      vars.AUTOMERGE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request' ||
         (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch != 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: automation
    concurrency:
      group: neurodelo-auto-merge
      cancel-in-progress: false
    steps:
      # Runs trusted main only; never downloads a PR artifact or executes PR source.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-administration: read
          permission-checks: read
          permission-actions: read
      - name: Enable only independently reviewed passing PRs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python scripts/github/control.py auto-merge
