name: Enable approved auto-merge

on:
  workflow_run:
    workflows: ['NeuroDelo CI/CD']
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure_validated_main:
    name: Configure CI/CD after validated main
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.AUTOMATION_READY != 'true' &&
      vars.BOOTSTRAP_CONFIGURED_SHA != github.event.workflow_run.head_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: automation
    concurrency:
      group: spaceweb-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Ensure successful validated SHA is still current main
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$head" = "$VALIDATED" || { echo 'Stale validated SHA: not configuring'; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Configure fail-closed repository gates using existing automation grant
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo '::error::Missing automation environment admin secret'; exit 1; }
          python scripts/github/control.py bootstrap --apply

  approved:
    if: >-
      vars.AUTOMERGE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request' ||
         (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch != 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: automation
    concurrency:
      group: neurodelo-auto-merge
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Runs trusted main only; never downloads a PR artifact or executes PR source.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        if: vars.AUTOMERGE_APP_ID != ''
        with:
          app-id: ${{ vars.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-administration: read
          permission-checks: read
          permission-actions: read
      - name: Enable only independently reviewed passing PRs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GITHUB_DISPATCH_TOKEN: ${{ github.token }}
          AUTOMATION_READY: ${{ vars.AUTOMATION_READY }}
          BOOTSTRAP_CONFIGURED_SHA: ${{ vars.BOOTSTRAP_CONFIGURED_SHA }}
          BOOTSTRAP_APPROVED_SHA: ${{ vars.BOOTSTRAP_APPROVED_SHA }}
          GITHUB_TOKEN_FALLBACK: ${{ steps.app.outputs.token == '' && 'true' || 'false' }}
        run: python scripts/github/control.py auto-merge
