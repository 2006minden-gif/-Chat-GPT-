name: Enable approved auto-merge

on:
  workflow_run:
    workflows: ['NeuroDelo CI/CD']
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      validated_run_id:
        description: 'Optional successful branch CI run to replay PR creation; never authorizes merging'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  configure_validated_main:
    name: Configure CI/CD after validated main
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.AUTOMATION_READY != 'true' &&
      vars.BOOTSTRAP_CONFIGURED_SHA != github.event.workflow_run.head_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: automation
    concurrency:
      group: spaceweb-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - name: Ensure successful validated SHA is still current main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$head" = "$VALIDATED" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Stale validated SHA: skipping configuration without marking it failed.'
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.current.outputs.current == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Configure fail-closed repository gates using existing automation grant
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo '::error::Missing automation environment admin secret'; exit 1; }
          python scripts/github/control.py bootstrap --apply


      - name: Start authorized first publication for the validated main
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_ADMIN_TOKEN }}
          GITHUB_DISPATCH_TOKEN: ${{ github.token }}
          VALIDATED: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts/github')
          from control import api, set_variable, REPO
          base = 'repos/' + REPO
          sha = os.environ['VALIDATED']
          if api('GET', base + '/git/ref/heads/main')['object']['sha'] != sha:
              raise SystemExit('Main changed; refusing outdated first publication')
          configured = api('GET', base + '/actions/variables/BOOTSTRAP_CONFIGURED_SHA')
          if configured['value'] != sha:
              raise SystemExit('Configuration must match validated main')
          set_variable(base, 'BOOTSTRAP_APPROVED_SHA', sha)
          set_variable(base, 'DEPLOY_PAUSED', 'false')
          api('POST', base + '/actions/workflows/deploy.yml/dispatches',
              {'ref': 'main', 'inputs': {'operation': 'bootstrap', 'expected_revision': sha}})
          print('Requested authorized bootstrap for validated main', sha)
          PY

  promote_verified_delivery:
    name: Enable routine deployment only after verified bootstrap
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.AUTOMATION_READY != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: automation
    concurrency:
      group: spaceweb-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify delivery evidence before enabling routine publication
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_ADMIN_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python scripts/github/bootstrap.py promote --run-id "$RUN_ID" --apply

  create_pr:
    name: Create PR after trusted branch validation
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch != 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.validated_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: automation
    concurrency:
      group: neurodelo-pr-creation
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      # Runs trusted main only; never downloads a PR artifact or executes PR source.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        if: vars.AUTOMERGE_APP_ID != ''
        with:
          app-id: ${{ vars.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
          permission-actions: read
      - name: Create missing PR without enabling merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GITHUB_DISPATCH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN_FALLBACK: ${{ steps.app.outputs.token == '' && 'true' || 'false' }}
          AUTOMERGE_ENABLED: ${{ vars.AUTOMERGE_ENABLED }}
          VALIDATED_RUN: ${{ inputs.validated_run_id }}
        run: |
          set -euo pipefail
          if [ "$AUTOMERGE_ENABLED" = true ]; then
            echo 'PR creation is independent; merge flag currently true'
          else
            echo 'PR creation is independent; merge flag currently false or unset'
          fi
          if [ -n "$VALIDATED_RUN" ]; then
            python scripts/github/control.py create-pr --run-id "$VALIDATED_RUN"
          else
            python scripts/github/control.py create-pr
          fi

  configure_integration:
    name: Verify and enable protected integration
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.AUTOMATION_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: automation
    concurrency:
      group: neurodelo-auto-merge
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Preserve actual review rules and enable verified merge path
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_ADMIN_TOKEN }}
          VALIDATED_MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo '::error::Existing automation administrative grant is unavailable'; exit 1; }
          python scripts/github/control.py configure-integration

  approved:
    if: >-
      vars.AUTOMERGE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request' ||
         (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch != 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: automation
    concurrency:
      group: neurodelo-auto-merge
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Runs trusted main only; never downloads a PR artifact or executes PR source.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        if: vars.AUTOMERGE_APP_ID != ''
        with:
          app-id: ${{ vars.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-administration: read
          permission-checks: read
          permission-actions: read
      - name: Enable only independently reviewed passing PRs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.BOOTSTRAP_ADMIN_TOKEN || github.token }}
          GITHUB_DISPATCH_TOKEN: ${{ github.token }}
          AUTOMATION_READY: ${{ vars.AUTOMATION_READY }}
          BOOTSTRAP_CONFIGURED_SHA: ${{ vars.BOOTSTRAP_CONFIGURED_SHA }}
          BOOTSTRAP_APPROVED_SHA: ${{ vars.BOOTSTRAP_APPROVED_SHA }}
          GITHUB_TOKEN_FALLBACK: ${{ steps.app.outputs.token == '' && secrets.BOOTSTRAP_ADMIN_TOKEN == '' && 'true' || 'false' }}
        run: python scripts/github/control.py auto-merge
