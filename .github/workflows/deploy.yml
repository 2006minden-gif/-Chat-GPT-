name: NeuroDelo CI/CD
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', inputs.operation, inputs.expected_revision) || format('Validate {0}', github.sha) }}

on:
  workflow_call:
    inputs:
      validation_only:
        type: boolean
        required: true
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      operation:
        description: 'Maintenance only; routine approved main pushes deploy automatically'
        type: choice
        options: [preview, deploy, rollback, bootstrap]
        default: preview
      expected_revision:
        description: 'Exact main SHA for a dispatch; required for deploy/bootstrap'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    services:
      mysql:
        image: mysql:5.7.44
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - '127.0.0.1:33077:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      NEURO_TEST_DSN: 'mysql:host=127.0.0.1;port=33077'
      NEURO_TEST_USER: root
      NEURO_TEST_PASSWORD: ''
      PHP_BIN: php
      APACHE_BIN: /usr/sbin/apache2
      APACHE_MODULE_DIR: /usr/lib/apache2/modules
    steps:
      - name: Validate dispatched revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED: ${{ inputs.expected_revision }}
          OPERATION: ${{ inputs.operation }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = deploy ] || [ "$OPERATION" = bootstrap ]; then
            [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]] && [ "$EXPECTED" = "$REVISION" ]
          elif [ -n "$EXPECTED" ]; then
            [ "$EXPECTED" = "$REVISION" ]
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, tokenizer
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install isolated test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apache2 mysql-client
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('CHROMIUM_BIN='+p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
      - name: Syntax and workflow validation
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find public private scripts tests -name '*.php' -print0)
          for file in public/*.js; do node --check "$file"; done
          python -m compileall -q scripts tests
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/actionlint_1.7.7_linux_amd64.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          (cd "$RUNNER_TEMP" && sha256sum -c "$GITHUB_WORKSPACE/scripts/ci/actionlint.sha256")
          tar -xzf "$RUNNER_TEMP/actionlint_1.7.7_linux_amd64.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Unit, integration, Apache, security and migration tests
        run: |
          set -euo pipefail
          python scripts/deploy/release.py --check
          node --test tests/api-client.test.cjs
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build checked release
        env:
          REVISION: ${{ github.sha }}
        run: python scripts/deploy/release.py "$RUNNER_TEMP/neurodelo-release" "$REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neurodelo-${{ github.sha }}
          path: ${{ runner.temp }}/neurodelo-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish approved main
    needs: validate
    if: >-
      inputs.validation_only != true &&
      github.ref == 'refs/heads/main' &&
      ((vars.AUTOMATION_READY == 'true' && vars.BOOTSTRAP_VERIFIED_RUN != '' && vars.BOOTSTRAP_VERIFIED_SHA != '') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap' &&
        vars.BOOTSTRAP_APPROVED_SHA == github.sha && vars.BOOTSTRAP_CONFIGURED_SHA == github.sha)) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (vars.DEPLOY_PAUSED != 'true' ||
       (github.event_name == 'workflow_dispatch' && (inputs.operation == 'preview' || inputs.operation == 'rollback')))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://neurodelo.pro
    concurrency:
      group: spaceweb-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require one-time protection bootstrap
        env:
          READY: ${{ vars.AUTOMATION_READY }}
          OPERATION: ${{ inputs.operation }}
          APPROVED: ${{ vars.BOOTSTRAP_APPROVED_SHA }}
          CONFIGURED: ${{ vars.BOOTSTRAP_CONFIGURED_SHA }}
          REVISION: ${{ github.sha }}
          VERIFIED_RUN: ${{ vars.BOOTSTRAP_VERIFIED_RUN }}
          VERIFIED_SHA: ${{ vars.BOOTSTRAP_VERIFIED_SHA }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = bootstrap ]; then
            [ "$APPROVED" = "$REVISION" ] && [ "$CONFIGURED" = "$REVISION" ]
          else
            [[ "$VERIFIED_RUN" =~ ^[0-9]+$ ]] && [[ "$VERIFIED_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$READY" = true || { echo '::error::Verified bootstrap delivery is required before automatic publication.'; exit 1; }
          fi
      - name: Skip obsolete commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" = "$REVISION" ]; then echo current=true >> "$GITHUB_OUTPUT"; else echo current=false >> "$GITHUB_OUTPUT"; echo '::notice::A newer main revision exists; this commit will not publish.'; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.current.outputs.current == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.current.outputs.current == 'true'
        with:
          name: neurodelo-${{ github.sha }}
          path: ${{ runner.temp }}/neurodelo-release
      - name: Recheck production environment before secret use
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github/bootstrap.py check
      - name: Publish or maintain checked release
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          PHP_CLI: ${{ vars.PHP_CLI }}
          OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy' }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [ "$current" = "$REVISION" ] || { echo '::error::Main changed before publication; refusing stale artifact.'; exit 1; }
          python scripts/deploy/client.py --bundle "$RUNNER_TEMP/neurodelo-release" --revision "$REVISION" --operation "$OPERATION" --report "$RUNNER_TEMP/deployment-report.json"
      - name: Record deployment evidence
        if: always() && steps.current.outputs.current == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-report.json
          if-no-files-found: warn
          retention-days: 14
